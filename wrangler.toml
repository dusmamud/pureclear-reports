name = "pureclear-reports"
main = "worker.js"
compatibility_date = "2026-10-19"

# Create the D1 database once in the Cloudflare dashboard
# (Workers & Pages > D1 > Create), then paste its ID below.
[[d1_databases]]
binding = "DB"
database_name = "pureclear_reports"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
